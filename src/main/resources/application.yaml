spring:
  application:
    name: frozenapi

  #DB 설정
  datasource:
    url: jdbc:mysql://hayabusa.proxy.rlwy.net:39047/railway
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        highlight_sql: true

phm:
  python:
    path: C:/user/sole/frozen-container-phm/python/venv/Scripts/python.exe
  script:
    path: C:/user/sole/frozen-container-phm/python/predict.py